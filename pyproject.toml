[project]
name = "eaa-aps12id"
version = "0.1.0"
description = "Custom EAA task managers, skills, tools and driver scripts for APS 12-ID."
readme = "README.md"
authors = [
    { name = "Ming Du", email = "mingdu@anl.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "botorch",
    "eaa-core",
    "gpytorch",
    "h5py",
    "networkx",
    "scipy",
    "scikit-learn",
    "torch",
]

[tool.uv.sources]
eaa-core = { git = "https://github.com/AdvancedPhotonSource/EAA.git", branch = "main", subdirectory = "packages/eaa-core" }
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[project.scripts]
eaa-aps12id = "eaa_aps12id:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
